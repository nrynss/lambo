name: docs

# Builds the Astro + Starlight docs site and deploys it to GitHub Pages.
# Triggered when a change under site/ lands on main, or manually.
#
# Note on location: GitHub only auto-detects workflows from the repository
# root `.github/workflows/`. To let this deploy automatically, copy it to the
# repository root as `.github/workflows/docs.yml` and adjust the `paths`
# filter. See site/README.md.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  workflow_dispatch:

# Deploys need the Pages write permission and the OIDC token Pages uses to
# identify the workflow. No secrets are required; `id-token` is enough.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
