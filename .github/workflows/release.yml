name: release

# Builds a `lambo` prebuilt binary for each target platform on a `v*` tag,
# computes SHA-256 checksums, attaches everything to the GitHub release for
# that tag, then publishes the crate to crates.io (so `cargo install lambo`
# keeps working). See .github/release/release-notes-template.md for the notes.
#
# Third-party actions are pinned to full 40-char commit SHAs (same convention
# as ci.yml). The release itself is published with the preinstalled `gh` CLI,
# so no extra third-party action is needed.
#
# Versioning: the version lives ONLY in Cargo.toml [package] version. A tag
# must be v<version>; the release job asserts that so a stale tag can never
# publish mismatched artifacts. To release: bump Cargo.toml, push, then
# `git tag v<version> && git push origin v<version>`.
#
# Dry run (workflow_dispatch): Actions -> release -> "Run workflow" on any
# branch builds, parity-tests, checksums and uploads every matrix asset as a
# workflow artifact, and publishes NOTHING. Two independent guards make that
# hold:
#   1. `release` and `publish-crate` run only when the event is a tag push
#      (`github.event_name == 'push'` AND a refs/tags/v ref). Checking the ref
#      alone is not enough: a dispatch can be started ON a tag, and then
#      github.ref is refs/tags/v... too. `publish-crate` also needs `release`,
#      so a skipped release skips it a second way.
#   2. `dry_run` defaults to true, and a dispatch with dry_run=false is refused
#      outright by the first build step rather than silently doing a dry run
#      anyway: a real release is only ever a tag push.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and upload the assets as workflow artifacts only. Must stay true: publishing happens only from a v* tag push."
        type: boolean
        default: true

# Least privilege: read-only by default. Only `release`, which creates the
# GitHub release, gets contents: write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Builds third-party code (every dependency's build script runs here), so
    # its token must not be able to write to the repository.
    permissions:
      contents: read

    # Cargo features are per matrix entry. An entry without `features` gets the
    # full ship profile (T8.9): every compiled adapter in one binary, with
    # `[store] kind` / `[embedder] kind` picking the adapter at runtime. The one
    # caveat: the adapter code is compiled in, but its backing service must be
    # reachable at runtime (a `llama-server` for BGE, a cluster for Cockroach).
    # Only the Metal flavour sets `features`; the stock assets are unchanged.
    env:
      FEATURES: ${{ matrix.features || 'ship' }}

    # Every `run:` step here is bash. windows-latest defaults to PowerShell, which
    # parses `VERSION=$(...)` as a module name and fails the job before it builds.
    # Git Bash ships on the Windows runner, so pinning the shell keeps one script
    # working on all five targets.
    defaults:
      run:
        shell: bash
    # Linux targets build natively on the Ubuntu 24.04 runners (GLIBC 2.39).
    # The earlier debian:bookworm container (T12) existed only to keep the
    # shipped floor at GLIBC 2.34 for Amazon Linux 2023; that target is
    # deliberately dropped, so the container and its flaky in-container
    # process-spawning parity tests are gone. The "Assert max required GLIBC
    # <= 2.39" gate below still guards against a dependency bump silently
    # raising the floor further (the part of T12 worth keeping).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
            ext: ""
          - os: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
            ext: ""
          # The Metal flavour: ship plus the in-process candle embedder with its
          # Metal backend (`[embedder] kind = "candle"`, `device = "metal"`).
          # The stock ship assets carry no candle at all, so without this asset
          # a Metal rig can only run a hand-built binary. Pinned to macos-15,
          # like the stock macos-arm64 entry, so both Apple silicon assets come
          # from one image and SDK. (macos-14 is retired on 2026-11-02 and has
          # scheduled brownouts before then: actions/runner-images#13518. The
          # binaries still target macOS 11.0, the aarch64-apple-darwin default,
          # whichever image builds them.) CI's candle-metal job runs on macos-latest
          # and is a compile-only check (`cargo check`); it is left floating on
          # purpose so CI notices a newer image first, while the release stays
          # on a known image. Metal is a system framework, so the binary
          # still links nothing outside /System/Library and /usr/lib; the
          # "Assert system-only dylibs" step below enforces that.
          - os: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64-metal
            features: ship,embed-candle-metal
            ext: ""
          # x86_64-apple-darwin is deliberately not built. The macos-13 (Intel)
          # runner class never picked up this job across four tagged runs — it
          # sat queued for over an hour with nothing else of ours competing,
          # while every other target went green. Since the release job needs the
          # whole matrix, one starved runner blocked publication indefinitely.
          #
          # Intel Macs are not a target audience for this project, and Apple
          # silicon users are served by macos-arm64 below. Restore this entry if
          # that changes; nothing else in the workflow assumes five targets.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            ext: ".exe"
    steps:
      - name: Refuse a non-dry-run dispatch
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          echo "::error::A manual run is always a dry run. Publish by pushing a v<version> tag; re-run this dispatch with dry_run left true." >&2
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # macos-arm64 and macos-arm64-metal share an OS and a target triple, so
          # the default key would make them fight over one cache with different
          # feature sets. Key by asset name instead.
          key: ${{ matrix.name }}

      - name: Derive version and git sha
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # LAMBO_GIT_SHA is an option_env! read at compile time (src/ledger.rs):
          # without it the `serve --ledger` heartbeat reports git_sha
          # "unknown", and a rig that installs this asset cannot tell one
          # release binary from another in its ledger. Set it for both the
          # build and the parity test so the parity relink keeps the same value.
          echo "LAMBO_GIT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --features "$FEATURES" --target ${{ matrix.target }}

      - name: Binary + TOML parity test (release artifact)
        run: |
          set -euo pipefail
          # Drive the exact shipped binary (the `--features $FEATURES --target <triple>`
          # release artifact built above) with a real lambo.toml via
          # tests/binary_parity.rs. unix targets only: KillOnDrop/SIGTERM is unix.
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "parity test is unix-only (SIGTERM/KillOnDrop); skipping on Windows"
            exit 0
          fi
          # Run with the SAME default CARGO_TARGET_DIR and `--target <triple>` as
          # the build step, so env!("CARGO_BIN_EXE_lambo") resolves to
          # target/<triple>/release/lambo -- the exact artifact the Stage step
          # below copies and publishes -- not a fresh NESTED rebuild.
          # Every entry's $FEATURES contains ship, a superset of the parity
          # test's cfg gate (store-sqlite + embed-fixture are both in ship), so
          # this step compiles the entry's full feature set, never a
          # store-sqlite,embed-fixture subset. Cargo still relinks `lambo` into
          # that same path with the SAME features as the build step (same
          # release profile), so the staged artifact stays feature-complete and
          # is never clobbered by a subset binary. Because the parity run builds
          # the whole feature set, a ship-only (or Metal-only) regression fails
          # this build job.
          cargo test --release --features "$FEATURES" \
            --test binary_parity --target ${{ matrix.target }}

      - name: Stage and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/lambo${{ matrix.ext }}" "dist/lambo-${VERSION}-${{ matrix.name }}${{ matrix.ext }}"
          cd dist
          ASSET="lambo-${VERSION}-${{ matrix.name }}${{ matrix.ext }}"
          # `sha256sum` is GNU coreutils: present on Linux, bundled with Git Bash
          # on the Windows runner, and absent on macOS — where `shasum` is the
          # base-install equivalent. Both emit "<hash>  <filename>", which is the
          # format scripts/install.sh parses, so either produces a valid asset.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" > "${ASSET}.sha256"
          else
            shasum -a 256 "$ASSET" > "${ASSET}.sha256"
          fi
          # Never publish an unverifiable asset.
          test -s "${ASSET}.sha256"
      - name: Assert max required GLIBC <= 2.39 (Linux only)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          BIN="dist/lambo-${VERSION}-${{ matrix.name }}"
          max_glibc=$(readelf -V "$BIN" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "max required GLIBC: $max_glibc"
          # 2.39 is the Ubuntu 24.04 runner's glibc — the floor the build
          # guarantees. If a dependency bump ever pulls in a newer symbol,
          # sort -V reports the higher of {2.39, max} and the gate fails,
          # so the shipped floor cannot silently creep above the build host.
          req=$(printf '2.39\n%s' "${max_glibc#GLIBC_}" | sort -V | tail -1)
          if [[ "$req" != "2.39" ]]; then
            echo "::error::$BIN requires $max_glibc (> 2.39); the shipped glibc floor must not exceed the Ubuntu 24.04 build host" >&2
            exit 1
          fi

      - name: Assert system-only dylibs (Metal asset)
        if: matrix.name == 'macos-arm64-metal'
        run: |
          set -euo pipefail
          BIN="dist/lambo-${VERSION}-${{ matrix.name }}"
          # Fail closed. `otool -L` exits 0 on a file that is not Mach-O at all
          # (it prints "is not an object file" and lists nothing), so a dylib
          # filter alone would pass a truncated download, a text file or a
          # Linux ELF. Require an arm64 Mach-O executable first, then a load
          # list that names libSystem (every macOS executable links it, so an
          # empty or unparsed list fails here instead of passing).
          kind=$(file -b "$BIN")
          echo "file: $kind"
          if [[ "$kind" != "Mach-O 64-bit executable arm64"* ]]; then
            echo "::error::$BIN is not a Mach-O arm64 executable: $kind" >&2
            exit 1
          fi
          libs=$(otool -L "$BIN")
          echo "$libs"
          deps=$(tail -n +2 <<<"$libs" | awk '{print $1}')
          # A here-string, not a pipe: `grep -q` exits on the first match, and
          # under pipefail a writer killed by SIGPIPE would fail the check.
          if ! grep -qx '/usr/lib/libSystem.B.dylib' <<<"$deps"; then
            echo "::error::$BIN does not list /usr/lib/libSystem.B.dylib; otool -L output was not a load list" >&2
            exit 1
          fi
          # Metal, Foundation and friends are system frameworks, so a clean
          # macOS needs nothing installed. A dependency that starts linking a
          # Homebrew or bundled dylib (/opt/homebrew, @rpath, ...) would ship a
          # binary that fails to launch on a machine without it; fail here.
          bad=$(grep -v -e '^/System/Library/' -e '^/usr/lib/' <<<"$deps" || true)
          if [[ -n "$bad" ]]; then
            echo "::error::$BIN links libraries outside /System/Library and /usr/lib:" >&2
            echo "$bad" >&2
            exit 1
          fi

      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lambo-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish-release
    needs: build
    # Tag pushes only. A dry-run dispatch skips this job (and so publish-crate),
    # including a dispatch started on a tag ref; see the header.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Derive version from Cargo.toml
        id: version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Assert tag matches Cargo.toml version
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match Cargo.toml version 'v$VERSION'. Bump Cargo.toml, commit, tag, then push the new tag." >&2
            exit 1
          fi

      - name: Download all binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: lambo-*
          merge-multiple: true
          path: dist
      - name: Render release notes
        run: |
          set -euo pipefail
          # The template carries a literal __LAMBO_VERSION__ placeholder;
          # substitute the version derived from Cargo.toml above (already
          # asserted to match the tag). GitHub scans run-block text - comments
          # included - for expression markers, so no curly-brace expression
          # sequence may appear in this script; the placeholder is
          # deliberately brace-free.
          sed "s/__LAMBO_VERSION__/$VERSION/g" \
            .github/release/release-notes-template.md > "/tmp/notes-$VERSION.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The documented primary install path fetches install.sh from
          # /releases/latest/download/install.sh. GitHub's /releases/latest/
          # download/ endpoint serves release ASSETS only, so the script must
          # be attached to the release here (alongside the binaries).
          cp scripts/install.sh dist/install.sh
          gh release create "$GITHUB_REF_NAME" \
            --title "Lambo v$VERSION" \
            --notes-file "/tmp/notes-$VERSION.md" \
            --verify-tag \
            dist/lambo-* dist/install.sh

  publish-crate:
    name: publish-crate
    needs: release
    # Same guard as `release`, stated again so this job never depends on the
    # skip propagating through `needs` alone.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        # No `toolchain:` input (v020-R1-P3-1): the committed rust-toolchain.toml
        # (1.97.1) governs this job, matching ci.yml and the build job above.
        # The `# 1.97.1` comment pins the dtolnay action code revision, not the
        # toolchain.
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
