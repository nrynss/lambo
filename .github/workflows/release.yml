name: release

# Builds a `lambo` prebuilt binary for each target platform on a `v*` tag,
# computes SHA-256 checksums, and attaches everything to the GitHub release
# for that tag. See .github/release/release-notes-template.md for the notes.
#
# Third-party actions are pinned to full 40-char commit SHAs (same convention
# as ci.yml). The release itself is published with the preinstalled `gh` CLI,
# so no extra third-party action is needed.
#
# Versioning: the version lives ONLY in Cargo.toml [package] version. A tag
# must be v<version>; the release job asserts that so a stale tag can never
# publish mismatched artifacts. To release: bump Cargo.toml, push, then
# `git tag v<version> && git push origin v<version>`.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The full ship profile (T8.9): every compiled adapter in one binary.
  # `[store] kind` / `[embedder] kind` pick the adapter at runtime. The one
  # caveat: the adapter code is compiled in, but its backing service must be
  # reachable at runtime (a `llama-server` for BGE, a cluster for Cockroach).
  FEATURES: ship

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Every `run:` step here is bash. windows-latest defaults to PowerShell, which
    # parses `VERSION=$(...)` as a module name and fails the job before it builds.
    # Git Bash ships on the Windows runner, so pinning the shell keeps one script
    # working on all five targets.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
            ext: ""
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
            ext: ""
          # x86_64-apple-darwin is deliberately not built. The macos-13 (Intel)
          # runner class never picked up this job across four tagged runs — it
          # sat queued for over an hour with nothing else of ours competing,
          # while every other target went green. Since the release job needs the
          # whole matrix, one starved runner blocked publication indefinitely.
          #
          # Intel Macs are not a target audience for this project, and Apple
          # silicon users are served by macos-arm64 below. Restore this entry if
          # that changes; nothing else in the workflow assumes five targets.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            ext: ".exe"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Derive version from Cargo.toml
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --features "$FEATURES" --target ${{ matrix.target }}

      - name: Binary + TOML parity test (release artifact)
        run: |
          set -euo pipefail
          # Drive the exact shipped binary (the `--features ship --target <triple>`
          # release artifact built above) with a real lambo.toml via
          # tests/binary_parity.rs. unix targets only: KillOnDrop/SIGTERM is unix.
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "parity test is unix-only (SIGTERM/KillOnDrop); skipping on Windows"
            exit 0
          fi
          # Run with the SAME default CARGO_TARGET_DIR and `--target <triple>` as
          # the build step, so env!("CARGO_BIN_EXE_lambo") resolves to
          # target/<triple>/release/lambo -- the exact artifact the Stage step
          # below copies and publishes -- not a fresh NESTED rebuild.
          # `--features ship` is a superset of the parity test's cfg gate
          # (store-sqlite + embed-fixture are both in ship), so this step
          # compiles the full ship profile, never a store-sqlite,embed-fixture
          # subset. Cargo still relinks `lambo` into that same path with full
          # ship features (identical feature set, same release profile), so the
          # staged artifact stays feature-complete and is never clobbered by a
          # subset binary. Because the parity run builds the whole ship profile,
          # a ship-only regression now fails this build job.
          cargo test --release --features "$FEATURES" \
            --test binary_parity --target ${{ matrix.target }}

      - name: Stage and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/lambo${{ matrix.ext }}" "dist/lambo-${VERSION}-${{ matrix.name }}${{ matrix.ext }}"
          cd dist
          ASSET="lambo-${VERSION}-${{ matrix.name }}${{ matrix.ext }}"
          # `sha256sum` is GNU coreutils: present on Linux, bundled with Git Bash
          # on the Windows runner, and absent on macOS — where `shasum` is the
          # base-install equivalent. Both emit "<hash>  <filename>", which is the
          # format scripts/install.sh parses, so either produces a valid asset.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" > "${ASSET}.sha256"
          else
            shasum -a 256 "$ASSET" > "${ASSET}.sha256"
          fi
          # Never publish an unverifiable asset.
          test -s "${ASSET}.sha256"

      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lambo-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Derive version from Cargo.toml
        id: version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Assert tag matches Cargo.toml version
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match Cargo.toml version 'v$VERSION'. Bump Cargo.toml, commit, tag, then push the new tag." >&2
            exit 1
          fi

      - name: Download all binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: lambo-*
          merge-multiple: true
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The documented primary install path fetches install.sh from
          # /releases/latest/download/install.sh. GitHub's /releases/latest/
          # download/ endpoint serves release ASSETS only, so the script must
          # be attached to the release here (alongside the binaries).
          cp scripts/install.sh dist/install.sh
          gh release create "$GITHUB_REF_NAME" \
            --title "Lambo v$VERSION" \
            --notes-file .github/release/release-notes-template.md \
            --verify-tag \
            dist/lambo-* dist/install.sh
