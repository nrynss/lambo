name: dependencies

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - rust-toolchain.toml
      - .github/workflows/dependencies.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - rust-toolchain.toml
      - .github/workflows/dependencies.yml
  schedule:
    - cron: '24 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (${{ matrix.target }}, ${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            features: ship
          - target: aarch64-unknown-linux-gnu
            features: ship
          - target: aarch64-apple-darwin
            features: ship
          - target: aarch64-apple-darwin
            features: ship,embed-candle-metal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          rust-version: '1.100.0'
          arguments: --locked --no-default-features --features ${{ matrix.features }} --target ${{ matrix.target }}
          command-arguments: advisories bans licenses sources
