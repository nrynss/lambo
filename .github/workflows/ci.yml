name: ci

# Third-party actions are pinned to full 40-char commit SHAs, with the human
# version in a trailing comment. A tag (`@v4`) and a branch (`@1.97.1`) are both
# mutable — whoever controls the action repo can repoint them at new code that
# then runs with this workflow's token and secrets, including
# `secrets.LAMBO_COCKROACH_DSN` in the cockroach-live job below. A SHA cannot be
# repointed. Note `dtolnay/rust-toolchain@1.97.1` is a *branch*, not a tag, so it
# was the most mutable of the three.
# To upgrade: bump the SHA and the comment together, never the comment alone.
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha
# (annotated tags need a second deref through /git/tags/<sha>; use
#  .../git/ref/heads/<branch> for a branch-versioned action)

# Path filter: the dev-diary is written on every task handoff and adversarial
# review, and none of it can change a build result. CI runs only for inputs the
# compiler or the test binaries actually read.
#
# NOT just `src/**/*.rs` — three non-Rust trees are real compile/test inputs and
# MUST stay in this list:
#   * migrations/**       `include_str!` into store/cockroach.rs + store/sqlite.rs
#   * fixtures/**         `include_str!` (mutations-batch.json) and golden files
#                         read via CARGO_MANIFEST_DIR at test time
#   * lambo.example.toml  `include_str!` in config.rs — it is a tested contract,
#                         not documentation, despite the name
# Adding a new include_str!/CARGO_MANIFEST_DIR read outside these paths means
# adding that path here, or CI goes blind to it.
#
# Deliberately excluded: dev-diary/**, README.md, AGENTS.md, LICENSE, spikes/**
# (standalone crates, not workspace members — the root package has no
# [workspace], so `cargo test --all` never builds them).
#
# NOT wholly excluded: docs/** and scripts/** are otherwise, but the J5
# mirror-drift gate makes four of the doc files and one script real CI inputs:
#   * the four mirror mdx files below (docs/reference/{cli,mcp}.mdx and
#     site/src/content/docs/{cli,mcp}.mdx) — hand-maintained prose pairs that must
#     stay in sync, checked by the docs-mirror job
#   * scripts/docs/check-mirror-drift.sh — the script that job runs
# Each is listed individually below so a mirror-only push still triggers CI.
# Everything else under docs/ and scripts/ stays excluded (not executed by CI).
#
# The two lists below MUST be kept identical. GitHub Actions does not support
# YAML anchors/aliases in workflow files, so this cannot be factored out.
on:
  push:
    # `**` is required: GitHub branch globs do not let `*` cross `/`, and real
    # phase branches are `phase/<slug>` (XP-1 — `'phase-*'` matched nothing).
    # lambo-for-mooshik: branch work for the Mooshik integration (see
    # dev-diary/lambo-for-mooshik/README.md). Jobs that need infrastructure this
    # branch does not touch are gated off below by `if:` rather than deleted, so
    # merging the branch restores full CI on main with no manual step.
    branches: [main, master, 'phase/**', 'lambo-for-mooshik']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'migrations/**'
      - 'fixtures/**'
      - 'lambo.example.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'docs/reference/cli.mdx'
      - 'docs/reference/mcp.mdx'
      - 'site/src/content/docs/cli.mdx'
      - 'site/src/content/docs/mcp.mdx'
      - 'scripts/docs/check-mirror-drift.sh'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'migrations/**'
      - 'fixtures/**'
      - 'lambo.example.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'docs/reference/cli.mdx'
      - 'docs/reference/mcp.mdx'
      - 'site/src/content/docs/cli.mdx'
      - 'site/src/content/docs/mcp.mdx'
      - 'scripts/docs/check-mirror-drift.sh'
      - '.github/workflows/ci.yml'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        # fixtures is deliberately NOT in `default` (v020-R1-P3-3 — test-only
        # profile); enable it explicitly so the fixtures-gated behavior tests
        # (canon goldens, recall goldens, GC, stage1-3, daemon loops,
        # tests/rebuild_session.rs) keep running on the default path.
        run: cargo test --all --features fixtures

  # docs-mirror (J5): the `--ledger`/transport prose is hand-maintained in four
  # copies — docs/reference/{cli,mcp}.mdx and site/src/content/docs/{cli,mcp}.mdx —
  # that must stay in sync. They are deliberately NOT byte-identical files (the
  # site copies carry Astro imports, a `/lambo/` link prefix, and a site-only
  # mcp.mdx section), so this compares each pair's canonical shared-prose form
  # after normalising those deltas — see scripts/docs/check-mirror-drift.sh.
  # The four mdx paths and that script are listed in the path filter above so a
  # mirror-only push still triggers CI. Landed BEFORE the J5 prose edits, per §J5.
  docs-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Mirror drift check (cli + mcp prose pairs)
        run: bash scripts/docs/check-mirror-drift.sh

  # Feature-gated adapter tier (TEST-2): the default-features `check` job above
  # never compiles sqlite/cockroach. Every non-default combo that must stay
  # green gets a row here; all inherit RUSTFLAGS="-D warnings".
  feature-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # sqlite behavior tests (T3.6 matrix) on default features + sqlite
          # + fixtures. fixtures is test-only, not in `default`; the sqlite
          # fixtures tests (seed contract, mutations-batch round-trip,
          # structural agreement matrix) need it.
          - name: sqlite
            command: cargo test --features store-sqlite,fixtures
          # sqlite WITHOUT store-memory: the ungated MemoryStore import in the
          # test module (CON-4) must never regress.
          - name: sqlite-minimal
            command: cargo test --no-default-features --features store-sqlite
          # F (issue #5) — semantic recall on the default local store. Its own row
          # rather than trusting the `sqlite` row above, so a regression in the vector
          # leg is a named red row instead of one line in an 800-test log: without it
          # SQLite silently degrades to keyword-only and "memory recall" becomes a
          # property of the cloud tier.
          #
          # The guards after the run are the anti-vacuity checks the acceptance
          # criterion needs. A name filter that matches nothing exits 0, so a rename
          # would otherwise leave this row green while testing nothing. The test they
          # name proves the vector leg FIRED — a recording wrapper around the real
          # adapter captures every answer SQLite returned — rather than inferring a
          # vector hit from where a node landed in a rank.
          #
          # F-R1-6: the guards assert the RUN OUTCOME, not just the name. `--list`
          # prints ignored tests indistinguishably from live ones, so a `--list | grep`
          # alone is satisfied by an `#[ignore]`d test — green, and testing nothing.
          # Grepping the run output for the pinned test's `... ok` line closes that:
          # an ignored test prints `... ignored`, a renamed one prints nothing. The
          # `0 failed; 0 ignored` guard extends that to every other vector test in the
          # filter without pinning a count, so adding a vector test never needs a CI
          # edit (a count would rot; this does not).
          #
          # `pipefail` is set explicitly: the default runner shell is `bash -e`, where
          # a `cargo test` failure piped into `tee` would be masked by tee's exit 0.
          #
          # The clippy invocation is here because the `check` job lints default
          # features only, so ~1250 lines of vector code shipped unlinted (F-R1-7).
          - name: sqlite-vectors
            command: |
              set -o pipefail
              cargo clippy --all-targets --features store-sqlite,fixtures -- -D warnings
              cargo test --features store-sqlite,fixtures --lib store::sqlite::tests::vector \
                2>&1 | tee vector-run.log
              grep -q 'test store::sqlite::tests::vector_e2e::sqlite_vector_leg_fires_on_an_organically_derived_concept ... ok' vector-run.log
              grep -qE 'test result: ok\. [0-9]+ passed; 0 failed; 0 ignored' vector-run.log
              cargo test --features store-sqlite,fixtures --lib -- --list \
                | grep -q 'store::sqlite::tests::vector_e2e::sqlite_vector_leg_fires_on_an_organically_derived_concept'
          # No adapters at all.
          - name: minimal
            command: cargo check --no-default-features
          # cockroach without fixtures: compiles AND runs the test module
          # (dead-code-clean under -D warnings); live tests are #[ignore]d.
          - name: cockroach
            command: cargo test --no-default-features --features store-cockroach
          # Ship profile (cockroach + memory + embedders + fixtures).
          - name: demo
            command: cargo check --features demo
          # F-R2-2: the row that compiles COCKROACH TEST CODE together with
          # `fixtures`. No other row does: `demo` above is `cargo check` (no test
          # targets) and `cockroach` is `--no-default-features --features
          # store-cockroach` (no fixtures). That gap let three `StoreConfig`
          # literals inside `#[cfg(feature = "fixtures")]` cockroach/canon test
          # modules miss a new struct field — CI stayed green while
          # `cargo test --features ship,fixtures --lib` and
          # `cargo test --features demo` could not compile at all. `--all-targets`
          # is what makes this row see them, and `ship,fixtures` is the widest
          # adapter set in the tree (cockroach + memory + sqlite + embedders), so
          # it also lints the two SQL adapters against each other. Same argument
          # F-R1-7 made for `store-sqlite,fixtures` in the `sqlite-vectors` row.
          - name: ship-fixtures
            command: cargo clippy --all-targets --features ship,fixtures -- -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  # Live CockroachDB tier (secret-gated): runs the `#[ignore]`d live tests
  # (CRDB conformance suite, canon progression, vector EXPLAIN) against the
  # provisioned Lambo cloud cluster. `LAMBO_REQUIRE_LIVE=1` turns a missing
  # DSN / dead cluster into a hard failure, never a silent skip-as-green.
  cockroach-live:
    runs-on: ubuntu-latest
    # Gated off on lambo-for-mooshik. This is the ONLY job that connects to a
    # CockroachDB cluster, and the branch changes nothing about Cockroach's live
    # behaviour: A is a new embedder, B is a Postgres dialect split, C/D are
    # canonization, F is SQLite. `LAMBO_REQUIRE_LIVE=1` means a missing DSN is a
    # hard failure rather than a skip, so it cannot simply be left to no-op.
    # Restored automatically on merge: the condition is false only on this ref.
    if: github.ref != 'refs/heads/lambo-for-mooshik'
    env:
      RUSTFLAGS: "-D warnings"
      LAMBO_COCKROACH_DSN: ${{ secrets.LAMBO_COCKROACH_DSN }}
      LAMBO_REQUIRE_LIVE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Live CockroachDB tests (--ignored)
        run: cargo test --features store-cockroach,store-memory,fixtures --lib -- --ignored
