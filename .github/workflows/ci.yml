name: ci

# Third-party actions are pinned to full 40-char commit SHAs, with the human
# version in a trailing comment. A tag (`@v4`) and a branch (`@1.99.0`) are both
# mutable — whoever controls the action repo can repoint them at new code that
# then runs with this workflow's token. A SHA cannot be repointed. Note `dtolnay/rust-toolchain@1.99.0` is a *branch*, not a tag, so it
# was the most mutable of the three.
# To upgrade: bump the SHA and the comment together, never the comment alone.
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha
# (annotated tags need a second deref through /git/tags/<sha>; use
#  .../git/ref/heads/<branch> for a branch-versioned action)

# Cargo cache. rust-cache hashes every installed toolchain into its key, and the
# ubuntu runner images differ in their preinstalled stable (1.99.1 on some,
# 1.100.0 on others during a rollout), so one job alternated between two keys
# and about a third of the jobs in each run started cold. Every job therefore
# uninstalls all toolchains except the one rust-toolchain.toml selects before
# rust-cache computes its key. Only main saves: PR and other branch caches are
# scoped to their own ref, and they pushed the repo over the 10 GiB cache limit,
# evicting main's entries. PRs restore main's caches.

# Every event gets a lightweight classifier. A documentation-only success must
# never qualify as full Rust validation for a release; see the full-ci job.
on:
  push:
    branches: [main, master, 'phase/**', 'lambo-for-mooshik']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR commits may stop. Main and manual runs each get their own
# group so every exact SHA can finish validation and become release-eligible.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      mirror: ${{ steps.classify.outputs.mirror }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # PRs diff their event base against the checked-out merge commit;
          # pushes diff github.event.before against the checked-out commit.
          fetch-depth: 0
      - name: CI classifier and release gate tests
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Classify changed inputs
        id: classify
        run: python3 scripts/ci/classify_changes.py

  check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: rustfmt, clippy

      - name: Keep only the pinned toolchain
        run: |
          keep="$(rustup show active-toolchain | cut -d' ' -f1)"
          for t in $(rustup toolchain list --quiet); do
            if [ "$t" != "$keep" ]; then rustup toolchain uninstall "$t"; fi
          done
          rustup toolchain list

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: doc
        # Public docs must not link to private or missing items. Plain
        # `cargo doc` only warns, so without this they accumulate unnoticed.
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --features fixtures

      - name: test
        # fixtures is deliberately NOT in `default` (a test-only profile);
        # enable it explicitly so the fixtures-gated behavior tests
        # (canon goldens, recall goldens, GC, stage1-3, daemon loops,
        # tests/rebuild_session.rs) keep running on the default path.
        run: cargo test --locked --all --features fixtures

  # The docs job. The mirrored page pairs differ intentionally in imports, link
  # prefixes and site-only sections; the mirror script checks their canonical
  # shared prose. The anchor and example checkers then check the pages' citations
  # of the Lean models, so the classifier also starts this job for changes to
  # formal/ and src/.
  docs-mirror:
    needs: changes
    if: needs.changes.outputs.mirror == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Mirror drift check (mirrored page pairs)
        run: bash scripts/docs/check-mirror-drift.sh
      # Pages backed by the Lean models cite their backing in MDX comments
      # (lean:, const:, code:, test:, oracle:). These fail when a cited theorem,
      # pinned constant or code item is renamed or removed, and when a worked
      # example stops matching the oracle case it was taken from.
      - name: Docs anchors resolve (lean, const, code, test)
        run: python3 -I scripts/docs/check-doc-anchors.py
      - name: Docs worked examples match the Lean oracle
        run: python3 -I scripts/docs/check-doc-examples.py
      - name: Docs checker tests
        run: |
          python3 -I scripts/docs/test_check_doc_anchors.py
          python3 -I scripts/docs/test_check_doc_examples.py

  # Feature rows. Cargo features only add code, so the release build (`ship`)
  # compiles every store and embedder the binary carries, and one full test
  # run over it covers the adapters the per-adapter rows used to test one at a
  # time. What a full build can hide is code that breaks with a feature OFF
  # (dead code under -D warnings, an import of MemoryStore that only compiles
  # because store-memory is on), so a no-default row keeps those builds.
  # Candle is outside `ship` and keeps its own row. Every row inherits
  # RUSTFLAGS="-D warnings".
  feature-matrix:
    name: feature-matrix (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The release feature set with fixtures: lints every adapter against
          # the others (both SQL adapters, cockroach test code with fixtures,
          # every embedder) and runs the whole suite with them compiled in.
          # The SQLite vector leg must run, never be ignored.
          - name: ship
            command: |
              set -o pipefail
              cargo clippy --locked --all-targets --features ship,fixtures -- -D warnings
              cargo test --locked --features ship,fixtures 2>&1 | tee ship-run.log
              grep -qF 'test store::sqlite::tests::vector_e2e::sqlite_vector_leg_fires_on_an_organically_derived_concept ... ok' ship-run.log
              if grep -E '^test store::sqlite::tests::vector[^ ]* \.\.\.' ship-run.log | grep -vE ' \.\.\. ok$'; then
                echo 'A SQLite vector test did not run successfully' >&2
                exit 1
              fi
          # Builds with features off, which `ship` cannot give: SQLite without
          # store-memory (catches accidental MemoryStore imports and test code
          # left dead without the default features), no adapters at all, and
          # the Postgres adapter linted without the default features.
          - name: no-default
            command: |
              set -o pipefail
              cargo test --locked --no-default-features --features store-sqlite
              cargo check --locked --no-default-features
              cargo clippy --locked --all-targets --no-default-features --features store-postgres -- -D warnings
          # The in-crate candle BGE-M3 embedder (not in `ship`): compiles and
          # its weightless unit tests pass on the default runner, with no
          # weights and no network; weight-loading tests stay #[ignore]d.
          - name: candle
            command: cargo test --locked --features embed-candle
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: rustfmt, clippy

      - name: Keep only the pinned toolchain
        run: |
          keep="$(rustup show active-toolchain | cut -d' ' -f1)"
          for t in $(rustup toolchain list --quiet); do
            if [ "$t" != "$keep" ]; then rustup toolchain uninstall "$t"; fi
          done
          rustup toolchain list

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ matrix.name }}

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  # Candle accelerator tier: the `candle` row in feature-matrix above builds the
  # BASE `embed-candle` feature only, and feature-matrix runs on ubuntu, so
  # NEITHER accelerator feature is compiled anywhere in CI by that row.
  # `embed-candle-metal` cannot be: it needs macOS. That is not a theoretical
  # gap — Metal is the ONLY configuration measured as viable on Apple
  # silicon (CPU landed at ~3% of the llama-server baseline), so the feature a
  # Mac operator actually ships was the one nothing compiled. `cargo check`,
  # not `cargo test`: the adapter's Metal behaviour needs real weights and a
  # reference server (see `live_metal_parity_against_the_llama_reference`,
  # `#[ignore]`d), so this row guards COMPILATION of the macOS-only cfg arms
  # and nothing more. It claims no more than it checks.
  #
  # KNOWN UNCOVERED, deliberately: `embed-candle-cuda`. Compiling it needs the
  # CUDA toolkit (cudarc's build script wants nvcc), which no runner here has
  # and which would mean a third-party toolkit action on every push. It is
  # built and exercised on the NVIDIA rig instead. The risk this accepts is
  # named rather than hidden: a change made on a Mac can break the CUDA cfg
  # arms and CI will stay green until that rig next builds.
  candle-metal:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Keep only the pinned toolchain
        run: |
          keep="$(rustup show active-toolchain | cut -d' ' -f1)"
          for t in $(rustup toolchain list --quiet); do
            if [ "$t" != "$keep" ]; then rustup toolchain uninstall "$t"; fi
          done
          rustup toolchain list
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: candle metal (compile only, no weights, no network)
        run: cargo check --locked --all-targets --features embed-candle-metal
        env:
          RUSTFLAGS: -D warnings

  # Release checks this exact job as well as the workflow conclusion. Skipped
  # Rust jobs cannot earn a full-ci success; failed/cancelled dependencies fail
  # the aggregate even though always() allows this job to report the result.
  full-ci:
    needs: [changes, check, feature-matrix, candle-metal]
    if: ${{ always() && needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every full validation job to succeed
        run: |
          test '${{ needs.changes.result }}' = success
          test '${{ needs.check.result }}' = success
          test '${{ needs.feature-matrix.result }}' = success
          test '${{ needs.candle-metal.result }}' = success
