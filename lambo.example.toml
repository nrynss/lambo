# Example Lambo process config (Level B pluggability).
# Copy to lambo.toml and adjust. Secrets stay in .env / the environment — not here.
#
# Selection rules: see dev-diary/notes/level-b-pluggability.md
# - Cargo features decide what is compiled in.
# - This file (or env) selects among compiled backends.
# - Unknown or uncompiled `kind` => hard startup error.

# Canonization's promotion selector. Omit for the established multi-writer
# default (`Swarm`). A lone writer that needs recurrence-based promotion must
# opt in explicitly. Values: `Swarm` | `Solo`, trimmed and case-insensitive
# (like store.kind / embedder.kind below); anything else is a hard startup
# error naming both what you wrote and the valid set — never a quiet fallback.
# `LAMBO_PROMOTION_POLICY` overrides this file value; an empty one is unset.
#
# It is a TOP-LEVEL key and must stay above the first [table] header. Move it
# below one and TOML scopes it into THAT table, so the refusal names that
# table's own keys and never the placement. Below [store] it reads:
#   unknown field `promotion_policy`, expected one of `kind`, `dsn`, `path`,
#   `vector_dim`
# — a store error about a key that was spelled correctly.
#
# There is no `lambo serve --promotion-policy` flag: this file or the env.
#
# `lambo demo` scripts its own config, so it ignores the VALUE — Solo does not
# change what the demo shows. It still validates it: the file is parsed before
# any command decides what to keep, so a bad value stops `demo` too — and stops
# `provision`, `saints`, `inspect` and `stats`, which never resolve an embedder.
# [daemon] below is the same bargain with a NARROWER scope: also discarded by
# demo, also refused when degenerate, but only by the commands that do resolve
# an embedder. Those four accept a degenerate cadence.
# promotion_policy = "Solo"

[store]
# memory | cockroach | postgres | sqlite
kind = "memory"
# Cockroach / Postgres-compatible DSN (prefer env LAMBO_COCKROACH_DSN for secrets):
# dsn = "postgresql://USER:PASSWORD@HOST:26257/lambo?sslmode=verify-full&sslrootcert=system"
# SQLite path when kind = "sqlite":
# path = "./lambo.db"
# Operator-asserted vector width pin, for stores whose vector column carries no width of
# its own (SQLite's BLOB). Omit it and the store simply ECHOES [embedder] dim below —
# which means check_vector_compatibility compares that number to itself and cannot catch
# a disagreement. Set it to assert the width this deployment's vectors use: resolve then
# refuses to start any serving verb whose embedder emits a different width, naming both
# numbers. That refusal is an explicit comparison in resolve_backends — setting the pin
# does NOT make check_vector_compatibility bite, because the store then reports the pin
# and the comparison is still a number against itself.
# Cockroach ignores it for REPORTING — VECTOR(n) in its own DDL is a real schema
# authority and wins there. The refusal above is kind-agnostic, though: a pin left in
# this file also refuses a cockroach or memory resolve whose embedder width differs.
# A stale pin failing loud is the point.
# vector_dim = 1024

[embedder]
# bge_m3 | gemini | candle | bedrock | fixture
# (`openai` is an alias of bge_m3: the same OpenAI-compatible adapter, still
# reported and stamped as bge_m3)
kind = "bge_m3"
# Expected embedder output width (default for BGE demos). Not a global product law:
# stores that persist vectors expose GraphStore::vector_dimensions(); process resolve
# requires a match. MemoryStore has no vector column → any positive dim is allowed.
# How much that match proves depends on the store. Cockroach reports its own VECTOR(n)
# DDL, so the check is real. SQLite's BLOB has no width of its own: it reports THIS
# number back (or store.vector_dim above, when set — which it then reports instead), so
# that comparison is vacuous for SQLite with a pin as well as without one; what catches a
# pin disagreement is the separate explicit pin check at resolve.
# What actually protects a SQLite database is the per-session embedding contract stamped
# in `sessions` — every candidate read refuses vectors from a different space.
dim = 1024
# llama.cpp OpenAI-compatible embeddings base URL (kind = bge_m3):
url = "http://127.0.0.1:8080"
# Optional model id sent to llama.cpp (empty => server default). Part of EmbeddingContract
# (kind+model+dim) — do not change mid-session without re-embedding.
# model = "bge-m3-FP16"
#
# Hosted OpenAI-compatible endpoint (issue #21), e.g. Cloudflare Workers AI, which
# serves BGE-M3 at 1024 dims. The adapter appends /v1/embeddings to `url`:
#   kind = "openai"
#   url = "https://api.cloudflare.com/client/v4/accounts/<account-id>/ai"
#   model = "@cf/baai/bge-m3"          # Workers AI's id, so the contract differs
#   api_key_env = "CLOUDFLARE_API_TOKEN"
# api_key_env NAMES the environment variable holding the token; the token never
# goes in this file (an inline `api_key = "..."` is refused). Lambo reads it at
# startup and sends `Authorization: Bearer <token>`; an unset or empty variable
# is a hard startup error naming it, never a request without a key. Without
# api_key_env no Authorization header is sent. LAMBO_EMBED_API_KEY_ENV
# overrides the name. It may not name LAMBO_AUTH_TOKEN, a [[serve.credential]]
# token_env, a store DSN variable or a Google credentials variable. Redirects
# are not followed, and `url` may not carry a query. Workers AI's bge-m3 and a local GGUF can differ
# numerically, so they are different embedding contracts: start a fresh session
# or `lambo re-embed`, never mix the two in one session.
# api_key_env = "CLOUDFLARE_API_TOKEN"
#
# In-crate candle BGE-M3 (kind = "candle", feature embed-candle): embeds locally, no
# llama.cpp server. Weights fetch from hf-hub on first use and cache under the
# hub cache; they are NEVER committed to the repo. The stamped EmbeddingContract
# model is the loaded artifact's identity (repo@revision + weight sha256 prefix),
# not the strings below. Migrating an existing session to candle:
#   stop serve; LAMBO_EMBEDDER=candle lambo re-embed --session <s> --agent <a>
# kind = "candle"
# Cold start: ~2-3 s warm load on every start; the very first use additionally
# fetches ~1.1 GB of weights from hf-hub (~60 s once, then cached). Plan the
# stdio client's startup timeout accordingly.
# Device: auto (default) resolves Metal on Apple silicon / CUDA elsewhere and is
# a HARD ERROR without one — CPU is never a silent default. Pin explicitly:
# device = "cpu"          # auto | cpu | metal | cuda
# hf-hub weights source overrides (defaults: the published f16 safetensors):
# repo = "BAAI/bge-m3"
# revision = "main"
# weights_file = "model.safetensors"
# Offline: never touch the network; fail loudly if weights are not cached.
# offline = true
# Or point at a local weights dir (config.json + tokenizer.json + weight file);
# bypasses hf-hub entirely:
# weights_dir = "/srv/lambo/bge-m3-f16"
#
# Keep-warm (issue #13), any kind, `lambo serve` only. While serve idles, the
# OS can compress or swap model weights nothing is touching, and the next
# call pays to bring them back. Keep-warm embeds one short fixed probe every N
# seconds and discards the vector; it writes nothing. Not part of the
# embedding contract. LAMBO_EMBED_KEEP_WARM_SECS overrides this value.
#   omitted = auto: every 10 s when the weights sit in unified memory that the
#             pager can compress (candle on Metal); off for everything else
#             (CUDA weights live in VRAM, the fixture has no weights, and
#             bge_m3/gemini hold their weights in another process)
#   0       = off
#   N       = every N seconds, for any kind (e.g. a bge_m3 llama-server on
#             the same Mac; each touch is then one HTTP embed request)
#             Not for gemini: each touch would be a billed Vertex AI request
#             and keeps nothing local warm.
# keep_warm_secs = 10
#
# Client-computed image vectors (#22), any kind. lambo_derive_image (MCP) and
# `lambo derive-image --vector-json` accept a vector a client computed, with
# the embedding contract it declares, only when this is true. Default false:
# such a call is refused, naming this key. Lambo checks that the declared
# contract (kind, model, dim) is exactly this session's and that the vector
# has the right width and a real direction, but it cannot verify that the
# vector really came from that model: turning this on trusts the client's
# label. It applies to every session this process serves.
# LAMBO_ACCEPT_CLIENT_VECTORS (true/false) overrides it.
# accept_client_vectors = false

# Daemon cadence. Optional; omit the whole section to use the defaults.
#
# Cadence only, never a threshold. Under the default `Swarm` policy, what a
# concept must clear to become Canonical (blast radius, distinct interactions,
# coverage, the peer score cut) lives in canon::stage{1,2,3} and is deliberately
# not settable from a file.
#
# WITH promotion_policy = "Solo" the paragraph above and the one below describe
# a promotion path that is not running. Solo decides on a recurrence score over
# the concept's own evidence: gc_survived, blast radius, distinct interactions
# and coverage are all ignored, and the score's bands replace the store-evidence
# stages. A lone writer reaches Canonical in a handful of mutations with zero GC
# sweeps, so with Solo you do NOT need to lower gc_interval — lowering it
# changes nothing about promotion.
#
# [daemon]
#
# Mutations between GC sweeps. Default 10000.
#
# Worth understanding before changing, and SWARM-ONLY: swarm's Stage 1 requires
# gc_survived >= 3, so at the default a concept needs roughly 30000 mutations
# before it can be promoted at all. The count is the deployment's lifetime, not
# one writer process's: the mutation epoch is persisted with the session and
# resumed on restart, so the sweeps arrive even in a low-write single-writer
# deployment. A session of a few dozen concepts still never gets there, which
# is why `lambo demo` sets this to 1 internally. Lower it if you want to watch
# the canonization state machine work on a small swarm session.
# gc_interval = 1
#
# GC also sweeps on time (issue #29): once gc_max_interval_secs has passed since
# the session's last sweep AND at least gc_idle_floor session mutations happened
# since it, whichever of this and gc_interval comes first. An idle session never
# sweeps on time alone. The last sweep's time and watermark persist with the
# session (sessions.last_gc_at / last_gc_epoch), so a restart does not reset the
# clock and does not by itself sweep; a writer that was down for days with at
# least gc_idle_floor unswept mutations sweeps once on its first cycle back. A
# session that has never swept starts the clock when a writer first sees it.
# Seconds; default 86400 (one day). Must be > 0.
# gc_max_interval_secs = 86400
#
# Session mutations since the last sweep below which the time bound does not
# fire. Default 100. Must be >= 1. Does not gate gc_interval.
# gc_idle_floor = 100
#
# Seconds between canonization evaluation passes. Default 60.
# canonization_eval_interval_secs = 5

# --- Recall tier (issue #18, feature recall-elastic) -------------------------
# Optional. An Elasticsearch index beside the durable [store] that serves the
# vector leg of recall. The store above stays the source of truth: leases,
# fencing, canonization and graph queries never touch Elasticsearch. Each
# committed flush is mirrored to the index; a mirror failure never fails the
# flush, it marks the session stale and recall serves vectors from the store
# until the index is repaired (by the session's writer at its next load or
# flush, or by `lambo recall-index backfill --session <s>` with no writer).
# Search lags a flush by up to the index refresh interval (1 s by default).
# Repairs run in the background; unleased (seed) writes are not mirrored.
# Vector indices use float HNSW and hits are re-scored with exact cosine.
# index_prefix must not contain "-v-" or end in "-v"; url must carry no
# credentials, query string or fragment; timeout_ms must be above zero.
#
# A top-level table, not [store.recall]. A binary built without the feature
# refuses this section by name. The API key is by reference only: name the
# environment variable that holds it, never the key itself. Omit api_key for
# a cluster with security off.
#
# [recall]
# kind = "elastic"
# url = "https://my-cluster.es.example.com"
# api_key = { env = "LAMBO_ES_API_KEY" }
# index_prefix = "lambo"
# refresh = "false"
# timeout_ms = 5000

# Multi-session serving (#32). Optional; omit the whole section and `lambo
# serve` behaves exactly as it always has. An http `lambo serve` pins
# `sessions` beside its --session values, serves default_session at /mcp and
# enforces max_attached. A stdio `lambo serve` started without --session takes
# its session from [[serve.projects]], then default_session (--session always
# wins; an http serve never reads [[serve.projects]]). The rest is PARSED AND
# VALIDATED ONLY (credentials and the on-demand bounds arrive in later
# releases), but a malformed table already stops every command, like any
# unknown key.
# A [[serve.projects]] path is absolute or starts with ~/; it and the working
# directory are compared as real paths (symlinks resolved). With HOME unset
# (or relative), ~ entries are skipped with one warning. One global map for
# every project only applies when the client passes --config (or sets
# LAMBO_CONFIG); otherwise each serve reads its project's ./lambo.toml.
#
# Every session named here must be addressable by URL: 1 to 128 bytes of
# [A-Za-z0-9._:-], not starting with '.'. A name outside that rule can still
# be served on its own with `lambo serve --session <name>`.
#
# Credentials name the ENVIRONMENT VARIABLE that holds their token
# (token_env); an inline `token = "..."` is refused. Each credential covers
# `sessions` (exact names, or "*" for every pinned session plus every session
# under any credential's prefix) and/or `session_prefix` (ids that start with
# it and are longer). Flags: create (may attach a session that does not exist
# yet), erase, admin. The names "default" and "local" are reserved, and
# token_env may not be LAMBO_AUTH_TOKEN. token_env must be an upper-case
# variable name ([A-Z_][A-Z0-9_]*, at most 64 bytes); a value that looks like
# a token is refused without being quoted.
#
# --- [serve] example begins ---
# [serve]
# sessions = ["lambo", "rustydocs", "general"]   # pinned: attached at startup
# default_session = "general"                    # what /mcp and stdio use
# max_attached = 16                              # pinned + on-demand, >= pinned
# attach_concurrency = 2
# idle_detach_secs = 900                         # on-demand sessions only
# per_session_rps = 50                           # default: --rate-limit-rps
#
# [[serve.projects]]                             # stdio without --session:
# path = "~/Documents/work/lambo"                # longest path containing the
# session = "lambo"                              # cwd wins, else default_session
#
# [[serve.credential]]
# name = "agents"
# token_env = "LAMBO_AGENTS_TOKEN"
# sessions = ["lambo", "rustydocs", "general"]
#
# [[serve.credential]]
# name = "dresscode"
# token_env = "LAMBO_DRESSCODE_TOKEN"
# session_prefix = "dc-u-"
# create = true
# erase = true
#
# [[serve.credential]]
# name = "operator"
# token_env = "LAMBO_OPERATOR_TOKEN"
# sessions = ["*"]
# erase = true
# admin = true
# --- [serve] example ends ---

# Optional. The read-only window's views (`lambo serve-web`, #4). The window
# reads one shared view of the session, reloaded at most once per
# view_ttl_ms however many tabs poll it; 0 reloads on every request. SQLite
# always loads one session at a time. A recall that waits 2 s for one of the
# recall_concurrency slots gets 503 with Retry-After: 1. Omit the table for
# these defaults.
#
# --- [web] example begins ---
# [web]
# view_ttl_ms = 1500           # 0 to 60000
# max_loaded_sessions = 4      # views kept in memory, least recently used dropped
# load_concurrency = 2         # session loads at once (1 on SQLite)
# recall_concurrency = 4       # recalls at once
# --- [web] example ends ---
