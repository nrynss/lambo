[package]
name = "bedrock-spike"
version = "0.1.0"
edition = "2021"
publish = false
description = "T0.4 Bedrock Titan Text Embeddings V2 smoke"

[dependencies]
anyhow = "1"
# credentials-login enables `aws login` browser sessions (not long-lived keys).
aws-config = { version = "1", features = ["credentials-login"] }
aws-sdk-bedrockruntime = { version = "1", features = ["behavior-version-latest"] }
dotenvy = "0.15"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
