[package]
name = "k1-candle-spike"
version = "0.0.1"
edition = "2021"
publish = false
description = "K1 spike: candle-native BGE-M3 (load / CLS-pool / L2-normalize) vs the rig's llama.cpp q8_0, three numbers with falsifiers (dev-diary/lambo-for-mooshik/K-candle-embedder.md)"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[dependencies]
anyhow = "1"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
hf-hub = { version = "1", features = ["blocking"] }
tokenizers = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
debug = false
