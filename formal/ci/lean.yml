name: lean

# Checks the Lean 4 proofs under formal/. The development has no Lake
# dependencies, so the only thing fetched is the Lean release itself, pinned by
# version (formal/lean-toolchain) and verified by SHA-256 below. No third-party
# action runs here beyond the SHA-pinned checkout (same pin as ci.yml).
# To upgrade Lean: bump formal/lean-toolchain and LEAN_SHA256 together.
#   curl -sSfL https://github.com/leanprover/lean4/releases/download/v<ver>/lean-<ver>-linux.tar.zst | sha256sum
on:
  push:
    paths:
      - 'formal/**'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'formal/**'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LEAN_SHA256: 2b7ab1ed8b92d2e6abfaf41344823b510064dbc9c0260cac73eb496ab2dea6eb

jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pinned Lean
        run: |
          set -euo pipefail
          ver="$(sed -n 's|^leanprover/lean4:v||p' formal/lean-toolchain)"
          test -n "$ver"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/lean.tar.zst" \
            "https://github.com/leanprover/lean4/releases/download/v${ver}/lean-${ver}-linux.tar.zst"
          echo "${LEAN_SHA256}  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          mkdir -p "$HOME/lean"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$HOME/lean" --strip-components=1
          echo "$HOME/lean/bin" >> "$GITHUB_PATH"

      - name: Build proofs
        working-directory: formal
        run: |
          set -euo pipefail
          lean --version
          lake build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Reject sorry and unexpected axioms
        working-directory: formal
        run: |
          set -euo pipefail
          if grep -rnwE 'sorry|admit' --include='*.lean' .; then
            echo "::error::sorry/admit found in the Lean sources"; exit 1
          fi
          if grep -nE "sorryAx|declaration uses 'sorry'" "$RUNNER_TEMP/build.log"; then
            echo "::error::a proof depends on sorry"; exit 1
          fi
