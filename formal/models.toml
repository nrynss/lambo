# Which Rust each Lean model in formal/LamboProofs/ describes, and a
# fingerprint of that Rust as it was when the model was last read against it.
# scripts/formal/check-model-drift.py reads this file: a model whose Rust no
# longer matches its `read_digest` is flagged on every run until the model is
# re-read and bumped (#291). See formal/README.md, "Keeping the models in step
# with the Rust".
#
# One [[model]] per .lean file under formal/LamboProofs/ (subdirectories
# included) other than the top-level Audit.lean, Drain/History.lean and
# Drain/Examples.lean (the drain model's history layer and concrete cases,
# which read no Rust of their own) and the shared lemma libraries under Lib/:
#
#   lean          the model file, from the repository root.
#   read_against  optional: the commit the model was last read against.
#                 Information for people, and a hint for the report (when it
#                 is a commit in the clone and the refs there fingerprint to
#                 read_digest, a drift report names only the refs that
#                 changed since it, with a `git diff`); only its format is
#                 checked. --bump does not change it: update it by hand.
#   read_digest   `v<N>:sha256:` (N the digest scheme) over the entry's refs,
#                 sorted, and each ref's code with comments and #[cfg(test)]
#                 code blanked and whitespace collapsed outside string and
#                 char literals. Never edit it by hand: after re-reading the
#                 model against the Rust (and updating the model if the
#                 change matters to it), run
#                   python3 -I scripts/formal/check-model-drift.py --bump Canon
#                 which rewrites this one line. That is the only way to clear
#                 a drift warning: editing the Lean file alone does not. The
#                 ref list is part of the digest, so adding, dropping or
#                 narrowing a ref is drift until bumped too.
#   rust          the Rust it models. A bare path is the whole file;
#                 `path#name` is every item called `name` in it (fn, struct,
#                 enum, trait, type, const, static, mod, union, macro_rules!,
#                 and the impl blocks of a type of that name, `impl dyn name`
#                 included); `path#Type::name` is `fn name` inside `impl Type`
#                 or `trait Type`. Whole files are listed where the
#                 model is of that module; items where it reads one part of a
#                 large shared file (src/types/mod.rs, src/main.rs, ...). An
#                 item ref does not cover the `use` imports or the helpers it
#                 calls: list those too when the model depends on them.
#
# Paths a header names only as context (a test, the issue #273 proposed split,
# a line the model does not read) are left out; each entry's comment says
# which.

[[model]]
lean = "formal/LamboProofs/Score.lean"
read_against = "514da8d7"
read_digest = "v2:sha256:1fd79ee811931b960c965e67999530f3f1d0f94767a3e4ad7735780ac35e7fca"
rust = [
  "src/daemon/score.rs",
