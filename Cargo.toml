[package]
name = "lambo"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Agentic graph memory — bipartite graph, canonization, MCP serve"
readme = "README.md"
repository = "https://github.com/nryn/lambo"
keywords = ["memory", "agents", "mcp", "graph"]
categories = ["asynchronous"]

[dependencies]
async-trait = "0.1"
axum = "0.8"
aws-config = { version = "1", features = ["credentials-login"] }
aws-sdk-bedrockruntime = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = "0.1"
rust-stemmers = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "sqlite",
    "uuid",
    "chrono",
] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2.0.20"
anyhow = "1.0.104"
bitflags = "2.13.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
httpmock = "0.7"

[[bin]]
name = "lambo"
path = "src/main.rs"
