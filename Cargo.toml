[package]
name = "lambo"
version = "0.2.2"
edition = "2021"
license = "Apache-2.0"
description = "Agentic graph memory for multi-agent AI operations: bipartite graph, canonization, MCP serve"
readme = "README.md"
repository = "https://github.com/nrynss/lambo"
keywords = ["memory", "agents", "mcp", "graph"]
categories = ["asynchronous"]
# crates.io tarball whitelist (v020-R1-P2-1): ONLY these paths ship. Internal
# trees (dev-diary/, evidence/, scripts/, docs/, site/, demo/, .grok/,
# .github/, AGENTS.md, .env.example) and tests/ (consumer builds don't need
# our integration suite) stay out. Cargo.toml, Cargo.lock (bin crate),
# Cargo.toml.orig and .cargo_vcs_info.json are auto-added by cargo.
include = [
    "src/**",
    "web/**",            # include_str! into cli/serve_web.rs (index.html/app.css/app.js)
    "migrations/**",     # include_str! into store/cockroach.rs + store/sqlite.rs
    "fixtures/**",       # include_str! (mutations-batch.json) + golden files at test time
    "examples/**",
    "lambo.example.toml",  # include_str! in config.rs — a tested contract
    "rust-toolchain.toml", # deliberately kept: governs consumer-side cargo-install toolchain
    # Anchored with a leading slash (H5). Cargo `include` patterns are
    # gitignore-style, so a bare "README.md" is unanchored and matched at every
    # depth: 0.2.0 shipped 14 internal READMEs from dev-diary/, evidence/,
    # scripts/, site/ and demo/ despite this whitelist.
    "/README.md",
    "/LICENSE",
    "/NOTICE",
]

[dependencies]
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
parking_lot = "0.12"
# MCP server (T8.2). `default-features = false` is REQUIRED, not style: rmcp's optional
# `reqwest` is `^0.13.2` and this repo pins reqwest 0.12 for BGE-M3 — default features
# would compile reqwest twice. None of the four features below reach reqwest.
rmcp = { version = "3.1.2", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
schemars = "1"
rust-stemmers = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2.0.20"
anyhow = "1.0.104"
bitflags = "2.13.1"
# J2-R1-3: `geteuid` for the per-uid endpoint directory and its ownership check.
# std has no equivalent, and the alternative (stat'ing a file we assume we own)
# is a guess where this needs a fact. Already in Cargo.lock transitively via
# tokio, so this line adds a direct edge and nothing else — `cargo build`
# downloads nothing new. The crate is unix-only regardless (tokio's
# `UnixListener`, `std::os::unix::fs`), so the dependency is not conditional.
libc = "0.2"

# --- optional: Level B adapters (see dev-diary/notes/level-b-pluggability.md) ---
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", optional = true, default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "uuid",
    "chrono",
] }
aws-config = { version = "1", optional = true, features = ["credentials-login"] }
aws-sdk-bedrockruntime = { version = "1", optional = true }

[features]
default = ["store-memory", "embed-bge", "embed-fixture"]

# Stores (GraphStore adapters)
store-memory = []
# P3: enable when CockroachStore lands (pulls sqlx + postgres).
store-cockroach = ["dep:sqlx", "sqlx/postgres"]
# P3: enable when SqliteStore lands (pulls sqlx + sqlite).
store-sqlite = ["dep:sqlx", "sqlx/sqlite"]

# Embedders
embed-fixture = []
embed-bge = ["dep:reqwest"]
# T7.1: Bedrock Titan when account is AUTHORIZED.
embed-bedrock = ["dep:aws-config", "dep:aws-sdk-bedrockruntime"]

# Committed fixture graphs for tests / fixture-ok parallel tracks (T1.4).
# Test-only: deliberately NOT in `default` (v020-R1-P3-3) — `cargo install
# lambo` must not pull test scaffolding. CI enables it explicitly where the
# fixtures-gated tests run (ci.yml check job + sqlite matrix row + demo row).
fixtures = ["store-memory"]
# Ship profile (T8.9): the FULL adapter set carried by released prebuilt
# binaries. One `lambo` binary holds every adapter; `[store] kind` /
# `[embedder] kind` pick one at runtime. `embed-bedrock` is deliberately
# omitted until the account is AUTHORIZED (notes/bedrock-authorization-blocker.md).
ship = ["store-memory", "store-cockroach", "store-sqlite", "embed-bge", "embed-fixture"]

# Convenience: hackathon / ship profile (store adapters as they land).
demo = ["store-memory", "store-cockroach", "embed-bge", "embed-fixture", "fixtures"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
httpmock = "0.7"

[[bin]]
name = "lambo"
path = "src/main.rs"
